name: 'Smoke test'
description: 'Builds and smoke-tests a dev container template'
inputs:
  template:
    description: 'Template to test'
    required: true
  runtime-version:
    description: 'Runtime version to test (defaults to the template default)'
    required: false

runs:
  using: composite
  steps:
    - name: Build template
      id: build_template
      shell: bash
      env:
        TEMPLATE_ID: ${{ inputs.template }}
        RUNTIME_VERSION: ${{ inputs.runtime-version }}
      run: bash "${{ github.action_path }}/build.sh" "${TEMPLATE_ID}"

    - name: Test template
      id: test_template
      shell: bash
      env:
        TEMPLATE_ID: ${{ inputs.template }}
        RUNTIME_VERSION: ${{ inputs.runtime-version }}
      run: bash "${{ github.action_path }}/test.sh" "${TEMPLATE_ID}"
